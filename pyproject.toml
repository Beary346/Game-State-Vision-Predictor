[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "game-state-vision-predictor"
version = "0.1.0"
description = "Detect and predict game state from fighting game screenshots"
requires-python = ">=3.11"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "xgboost>=2.0.0",
]
viz = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]
workflow = [
    "mlflow>=2.6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
